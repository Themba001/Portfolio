  <body class="bg-gray-900 text-white font-sans">
    <!-- Navbar -->
    <nav class="bg-gray-950 fixed top-0 w-full z-50 shadow-lg">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"

        <h1 class="text-2xl font-bold text-orange-500">Mabuza</h1>
        <ul class="flex space-x-6 text-sm md:text-base">

    <section class="pt-32 px-6 max-w-xl mx-auto">
      <h2 class="text-3xl font-bold text-orange-500 mb-3.5">Get In Touch</h2>
      <form
        action="https://formspree.io/f/YOUR_ID"
        method="POST"
        class="space-y-4"
      >
        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required
          class="w-full p-3 rounded bg-gray-800 text-white"
        />
        <input
          type="email"
          name="email"
          placeholder="Your Email"
          required
          class="w-full p-3 rounded bg-gray-800 text-white"
        />
        <textarea
          name="message"
          rows="4"
          placeholder="Your Message"
          required
          class="w-full p-3 rounded bg-gray-800 text-white"
        ></textarea>
        <button
          type="submit"
          class="bg-orange-500 hover:bg-orange-600 px-6 py-2 rounded font-semibold"
        >
          Send Message
        </button>
      </form>

      <div class="mt-8 text-sm text-gray-400">
        <p>
          Email:
          <a href="mailto:artinadutjoammakoma@gmail.com" class="text-orange-400"
            >artinadutjoammakoma@gmail.com</a
          >
        </p>
        <p>
          GitHub:
          <a href="https://github.com/YOUR_USERNAME" class="text-orange-400"
            >github.com/YOUR_USERNAME</a
          >
        </p>
        <p>
          LinkedIn:
          <a
            href="https://linkedin.com/in/YOUR_LINKEDIN"
            class="text-orange-400"
            >linkedin.com/in/YOUR_LINKEDIN</a
          >
        </p>
      </div>
    </section>
