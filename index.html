  <link href="./css/style.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/2d4b3488b4.js" crossorigin="anonymous"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a, #1e3a8a, #000000);
      background-size: 400% 400%;
      animation: aurora 30s ease infinite;
    }

    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="text-white font-sans">

  <!-- Navbar -->

      <!-- Hamburger button (visible on small screens) -->
      <button id="menu-btn" class="md:hidden text-white text-xl" aria-label="Toggle menu" aria-expanded="false">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Menu: hidden on small screens, flex on md+ -->
      <ul id="nav-menu" class="hidden md:flex space-x-6 text-sm md:text-base">
        <li><a href="index.html" class="hover:text-purple-300">Home</a></li>
        <li><a href="about.html" class="hover:text-purple-300">About</a></li>

      <img src="images/Mabuza.jpg" alt="Profile Picture" class="w-full h-full object-cover">
    </div>
    <h2 class="text-4xl sm:text-5xl font-extrabold text-purple-400 mb-4 animate-fade-in-down">Themba Mabuza</h2>
    <p class="text-lg sm:text-xl text-purple-200 max-w-xl mb-6 animate-fade-in">BSc IT Student | Software Developer | Future Amazon Engineer</p>

      <a href="https://github.com/Themba001" target="_blank" class="hover:opacity-80 transition-all">

      </a>
      <a href="https://linkedin.com/in/themba-mabuza-a0476a219" target="_blank" class="hover:opacity-80 transition-all">
